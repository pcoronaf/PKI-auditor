<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>demo-login: iniciar sesion</title>
<link rel="stylesheet" href="/shared/lab.css">
</head>
<body>
<main>
  <h1>Iniciar sesion</h1>
  <p class="sub">Aplicacion de laboratorio de FirmaScope &mdash; acceso a la plataforma de firma</p>
  <p class="warn">Cuenta de laboratorio: usuario <code>operador</code>, contrase&ntilde;a
  <code>laboratorio-firmascope</code>. No tiene nada que ver con la e.firma.</p>
  <form class="card" method="post" action="/api/login">
    <label for="username">Usuario</label>
    <input type="text" id="username" name="username" autocomplete="username">
    <label for="account-password">Contrase&ntilde;a de la cuenta</label>
    <input type="password" id="account-password" name="password" autocomplete="current-password">
    <button id="login" type="submit">Entrar</button>
    <div id="status" data-state="info"></div>
  </form>
</main>
<script>
/*
 * Como el portal real del primer piloto: una aplicacion de una pagina que lee
 * la contrasena de la cuenta con JavaScript y la envia con fetch en JSON. Es
 * esa lectura la que la instrumentacion marca como "campo de contrasena", y lo
 * que llevo a confundirla con la contrasena de la e.firma.
 */
document.querySelector('form').addEventListener('submit', async function (event) {
  event.preventDefault();
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'same-origin',
    body: JSON.stringify({
      username: document.getElementById('username').value,
      password: document.getElementById('account-password').value
    })
  });
  if (res.ok) {
    location.href = '/demo-login/';
  } else {
    document.getElementById('status').textContent = 'Usuario o contrasena incorrectos.';
  }
});
</script>
</body>
</html>
